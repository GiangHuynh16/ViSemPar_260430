model:
  name: Qwen/Qwen2.5-7B-Instruct
  flash_attn: true
  device_map: single_cuda
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
training:
  optimizer: adamw_torch
  lr: 4.328450221293881e-06
  scheduler: cosine
  warmup_ratio: 0.05
  epochs: 30
  batch_per_device: 1
  grad_accum: 16
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_length: 2048
  save_total_limit: 1
  logging_strategy: epoch
  early_stopping_patience: 5
  early_stopping_threshold: 0.0
data:
  amr1_weight: 1
  amr2_weight: 1
  syn_weight: 0
  dev_seed: 42
  train: vietnamese_v2/MTUP2_train.txt
  dev_formatted: vietnamese_v2/MTUP2_dev.txt
  val: data/formatted/vietnamese_v2/dev.txt
  test: data/raw/public_test.txt
seeds:
- 42
- 123
- 456
method: MTUP2
group: vietnamese_v2_mtup_2tasks_lrsearch
language: vi
no_var_mode: clean
decoding:
  max_new_tokens: 1536
run_name: MTUP2_lr1
