# base_v2.yaml – improved shared params for v2 experiments
#
# Changes vs base.yaml:
#   - epochs: 30  (checkpoint every epoch; select by dev Smatch)
#   - save_total_limit: 30  (keep all epoch checkpoints for objective selection)
#   - amr2_weight: 3 → 1  (no data duplication, use dev split instead)
#   - no_var_mode: legacy → clean  (Penman format, no v13)
#   - model selection is done externally by final-AMR dev Smatch, not dev loss.

model:
  name: Qwen/Qwen2.5-7B-Instruct
  flash_attn: false
  device_map: single_cuda

lora:
  r: 128
  alpha: 256
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  optimizer: adamw_torch
  lr: 5.0e-5
  scheduler: cosine
  warmup_ratio: 0.05
  epochs: 30
  batch_per_device: 1
  eval_batch_per_device: 1
  grad_accum: 16
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_length: 2048
  gradient_checkpointing: true
  timing_log_steps: 10
  save_total_limit: 30
  logging_strategy: epoch
  early_stopping_patience: null
  early_stopping_threshold: 0.0
  load_best_model_at_end: false
  eval_loss_during_training: false
  selection_metric: dev_smatch_final_amr

data:
  amr1_weight: 1
  amr2_weight: 1
  dev_seed: 42

seeds: [42, 123, 456]
